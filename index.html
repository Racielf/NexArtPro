    <!-- GitHub Pages SPA route restore -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          // Preserve the base path (/NexArtPro/) when restoring
          var base = window.location.pathname.replace(/\/$/, '');
          var restored = base + p + (q ? '?' + q : '') + window.location.hash;
          window.history.replaceState(null, '', restored);
        }
      })();
    </script>
